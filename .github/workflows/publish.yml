name: Publish container image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - lakefile.toml
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/zhihan/ubuntu-lean-mathlib:lean4.34.0-mathlib4.34.0-comparator-d03acab
            ghcr.io/zhihan/ubuntu-lean-mathlib:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
